[project]
name = "vakil"
version = "0.1.0"
description = "Autonomous chargeback defence agent for Razorpay merchants"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    # FastAPI needs this to accept multipart uploads. The Documents API
    # takes files, so the mock cannot even be imported without it - which
    # went unnoticed until a test imported the mock for the first time.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.40",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    # Renders the proof-of-delivery fixtures. A dev dependency rather than a
    # runtime one: the generator builds test data, it is not part of serving a
    # dispute. CI installs .[dev] and runs `make fixtures`, which is how the
    # missing declaration was found - it was pip-installed by hand locally and
    # never written down, so every fresh clone would have failed.
    "pillow>=11.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
vakil = "vakil.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vakil"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI parameters as call expressions in defaults. That is the
# framework's required idiom, not the mutable-default bug B008 looks for.
"src/vakil/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vakil"]
