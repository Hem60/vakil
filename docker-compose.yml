services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vakil
      POSTGRES_PASSWORD: vakil
      POSTGRES_DB: vakil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vakil"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn vakil.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://vakil:vakil@postgres:5432/vakil
      RAZORPAY_BASE_URL: http://mock-rzp:8080
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Stands in for Razorpay test mode. Disputes cannot be self-triggered against
  # the real sandbox, so the mock is how the filing path gets exercised. It
  # speaks the documented Disputes + Documents API shapes and nothing else.
  mock-rzp:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn vakil.file.mock_razorpay:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
